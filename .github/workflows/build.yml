# =============================================================================
# Build & Release — Proxy Download Manager
#
# Triggers:
#   - push tag v*        → build all platforms and publish the release
#   - workflow_dispatch  → rebuild a given existing tag (e.g. v0.22.0) and
#                          upload its assets into that tag's release
#
# Products:
#   macOS   → .dmg (aarch64 on macos-latest, x64 on macos-15-intel)
#   Windows → .exe (NSIS)
#   Linux   → .deb / .AppImage / .rpm
#
# Release uploads are incremental: every platform job uploads its own
# assets to the release as soon as its build finishes. Nothing waits for
# the slowest platform (the x64 macOS build), so early builds land first.
# =============================================================================

name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and upload assets into (e.g. v0.22.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Rust fmt, check, test
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  # ─── Create / update the release up front ─────────────────────────────────
  # Creates the release (with changelog body + browser-extension zips) once, so
  # every platform job below can upload its assets to an existing release
  # immediately without racing to create it.
  create-release:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract changelog for this release
        run: |
          awk -v ver="${RELEASE_TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_body.md

      - name: Package the browser extension
        run: |
          version="${RELEASE_TAG#v}"
          for browser in chrome edge firefox; do
            # manifest.json has to sit at the zip root for both stores.
            ( cd "browsers-extension/$browser" && zip -qr "$GITHUB_WORKSPACE/proxydm-extension-$browser-$version.zip" . )
          done
          ls -l proxydm-extension-*.zip

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release_body.md
          files: proxydm-extension-*.zip
          overwrite_files: true

  # ─── macOS (Apple Silicon / aarch64) ──────────────────────────────────────
  macos:
    needs: [create-release]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build DMG
        run: pnpm tauri build

      - name: Upload .dmg to release
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber

  # ─── macOS (Intel / x64) ──────────────────────────────────────────────────
  macos-x64:
    needs: [create-release]
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build DMG (x64)
        run: pnpm tauri build --bundles dmg

      - name: Upload .dmg to release
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber

  # ─── Windows ──────────────────────────────────────────────────────────────
  windows:
    needs: [create-release]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build NSIS (.exe)
        run: pnpm tauri build --bundles nsis

      - name: Upload .exe to release
        shell: bash
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber

  # ─── Linux ────────────────────────────────────────────────────────────────
  linux:
    needs: [create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build all Linux bundles
        run: pnpm tauri build --bundles deb,appimage,rpm

      - name: Upload Linux bundles to release
        run: |
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/rpm/*.rpm \
            --clobber
